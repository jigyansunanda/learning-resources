name: Update Resource Directory

on:
  push:
    paths:
      - "data/resources.json"
      - "scripts/generate_readme.py"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate README and sync data
        run: python scripts/generate_readme.py

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/resources.json
          git diff --cached --quiet || git commit -m "docs: auto-update resource directory"
          git push
